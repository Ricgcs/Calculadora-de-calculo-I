<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./index.css" />
    <title>Calc</title>
  </head>
  <body>
    <header>
      <div id="formula"></div>
      <button id="buttonFormula">click</button>
    </header>
    <div id="corpo"></div>
    <script>
      const sinais = ["+", "-"];
      const operadores = ["*"];
      const termosOcultos = [
        "Shift",
        "Alt",
        "Control",
        "CapsLock",
        "Tab",
        "ControlAltGraph",
        "Enter",
        "Escape",
        "Dead",
        "Insert",
        "Backspace",
        "Meta",
      ];

      const numeros = ["1", "2", "3", "4", "5", "6", "7", "8", "9", "0"];
      const letras = [
        "a",
        "b",
        "c",
        "d",
        "e",
        "f",
        "g",
        "h",
        "i",
        "j",
        "k",
        "l",
        "m",
        "n",
        "o",
        "p",
        "q",
        "r",
        "s",
        "t",
        "u",
        "v",
        "w",
        "x",
        "y",
        "z",
      ];

      function validar(val) {
        let res = false;
        if (val != undefined && Number.isNaN(Number(val))) {
          res = true;
        }
        return res;
      }

      document.addEventListener("DOMContentLoaded", () => {
        let qtdElementos = 0;
        let qtdSubDivs = 0;
        const formula = document.getElementById("formula");
        const corpo = document.getElementById("corpo");
        let divAtual, classeAtual;
        let divSubAtual;
        let ultDig = [];
        const elementoDiv = [];
        const elementoSubDiv = [];

        const buttonFormula = document.getElementById("buttonFormula");

        let div;
        let divSub;
        let anterior;
        let atual;

        function adicionarElemento(tecla) {
          // console.log(qtdElementos);
          if (
            qtdElementos == 0 ||
            tecla == "Enter" ||
            (anterior == "Backspace" &&
              (numeros.includes(tecla) || letras.includes(tecla)))
          ) {
            div = document.createElement("div");
            divSub = document.createElement("div");
            div.id = `div${qtdElementos}`;
            div.className = "elemento";
            classeAtual = "elemento";

            formula.appendChild(div);
            divAtual = `div${qtdElementos}`;
            divSub.id = `divSub${qtdSubDivs}`;
            divSub.className = "divSub";
            classeAtual = "divSub";
            divSubAtual = `divSub${qtdSubDivs}`;
            div.appendChild(divSub);

            qtdSubDivs++;
            qtdElementos++;
            teste = div.querySelectorAll("div");
            elementoDiv.push(div);
            elementoSubDiv.push(divSub);
          }

          anterior = ultDig[ultDig.length - 1];
          atual = tecla;

          if (
            anterior == "(" ||
            atual == "(" ||
            atual == ")" ||
            anterior == ")" ||
            (operadores.includes(anterior) &&
              classeAtual != "divSubPotencia" &&
              anterior == "(") ||
            (sinais.includes(atual) && anterior != "(") ||
            (sinais.includes(anterior) && ultDig[ultDig.length - 2] != "(") ||
            operadores.includes(atual) ||
            operadores.includes(anterior)
          ) {
            div = document.createElement("div");
            divSub = document.createElement("div");
            div.id = `div${qtdElementos}`;
            div.className = "elemento";
            classeAtual = "elemento";
            formula.appendChild(div);
            divAtual = `div${qtdElementos}`;
            divSub.id = `divSub${qtdSubDivs}`;
            divSub.className = "divSub";
            classeAtual = "divSub";
            divSubAtual = `divSub${qtdSubDivs}`;
            div.appendChild(divSub);

            qtdSubDivs++;
            qtdElementos++;
            elementoDiv.push(div);
            elementoSubDiv.push(divSub);
          }

          if (!termosOcultos.includes(tecla)) {
            //  alert(`anterior: ${(anterior)}/${Number.isNaN(Number(anterior))} atual: ${(atual)}/${Number.isNaN(Number(atual))} comparação: ${ Number.isNaN(Number(anterior)) && Number.isNaN(Number(atual))}`)
            //  alert(`atual: ${numeros.includes(ultDig[ultDig.length-2]) } anterior: ${numeros.includes(ultDig[ultDig.length-1])}`)

            if (
              (validar(anterior) !== false && validar(atual) == true) ||
              (validar(anterior) !== true && validar(atual) == false) ||
              anterior == "/" ||
              atual == "/"
            ) {
            } else {
              //alert(qtdSubDivs);
              // alert(classeAtual)
              if (classeAtual == "divSubPotencia") {
                // alert("entrar")
                if (
                  (validar(anterior) !== false && validar(atual) == true) ||
                  (validar(anterior) !== true && validar(atual) == false)
                ) {
                  // alert("entrou")
                  divSub = document.createElement("div");
                  divSub.appendChild(divSub);
                  // alert(qtdSubDivs)
                  divSub.id = `divSub${qtdSubDivs}`;
                  divSub.className = "divSub";
                  classeAtual = "divSub";

                  divSubAtual = `divSub${qtdSubDivs}`;
                }
              } else {
                divSub = document.createElement("div");
                div.appendChild(divSub);
                // alert(qtdSubDivs)
                divSub.id = `divSub${qtdSubDivs}`;
                divSub.className = "divSub";
                classeAtual = "divSub";

                divSubAtual = `divSub${qtdSubDivs}`;
                qtdSubDivs++;
              }
            }
            divSub.innerText += tecla;
            ultDig.push(tecla);
            elementoSubDiv.push(divSub);
          } //termos ocultos
          else {
            if (tecla == "Backspace") {
              deletarUltimo();
              elementoDiv.pop()
            }
            if (tecla == "Dead") {
              divSub = document.createElement("div");
              div.appendChild(divSub);
              // alert(qtdSubDivs);
              divSub.id = `divSub${qtdSubDivs}`;
              divSub.className = "divSubPotencia";
              classeAtual = "divSubPotencia";
              divSubAtual = `divSub${qtdSubDivs}`;
              qtdSubDivs++;
            }
          }
        }

        function deletarUltimo() {
          //const ultimo = elementos.pop();
          if (qtdElementos != 0) {
            let ultimo = formula.lastChild;
            formula.removeChild(ultimo);
            divAtual = elementoDiv[elementoDiv.length - 1];
            elementoDiv.pop();
            // alert(elementoDiv.length);
            // console.log(elementoDiv[elementoDiv.length - 1]);
            anterior = "Backspace";
            qtdElementos--;
          }
        }
        let a = 0;
        document.addEventListener("keydown", (tecla) => {
          adicionarElemento(tecla.key);
        });

        async function envio(rota, metodo, dado) {
          try {
            const envio = await fetch(`http://localhost:3000${rota}`, {
              method: metodo,
              headers: {
                "Content-Type": "application/json",
              },
              body: JSON.stringify(dado),
            });
            let envio2 = envio.json();
            return envio2;
          } catch (error) {
            console.log(error);
          }
        }
        buttonFormula.addEventListener("click", async () => {
          let elemento, teste, contador;
          let stringDiv = document.getElementsByClassName("elemento");
          let resposta = [];

          console.log("oi", stringDiv[0]);

          for (let a = 0; a < stringDiv.length; a++) {
            contador = 0;
            elemento = stringDiv[a];

            teste = elemento.getElementsByTagName("div");
            // console.log("Tamanho: "+tamanho);

            for (contador; contador < teste.length; contador++) {
              let valor = teste[contador].textContent;
              let tamanho = teste.length;
              console.log("Elemento2: " + valor + "\n tamanho: " + tamanho);

              if (valor == " ") {
                alert("entrou");
              }
            }
          }

          let operacao = [];
          console.log("Resultado: ", operacao);
          //  console.log("teste", resposta);

          //  const testeEnvio = await envio("/envio/string", "POST", resposta);
        });
      });
    </script>
  </body>
</html>
