      function validar(val) {
        let res = false;
        if (val != undefined && Number.isNaN(Number(val))) {
          res = true;
        }
        return res;
      }

      function parseFormula(str) {
        str = str.replace(/\s+/g, ""); // remove espaços
        const result = [];

        let i = 0;

        while (i < str.length) {
          const c = str[i];

          // ---------------------------------------------------
          // 1) Detectar COEFICIENTE (números seguidos)
          // Ex: "12x3" → "12"
          // ---------------------------------------------------
          if (/[0-9]/.test(c)) {
            let numero = "";

            // pega número completo
            while (i < str.length && /[0-9]/.test(str[i])) {
              numero += str[i];
              i++;
            }

            result.push(numero);
            continue;
          }

          // ---------------------------------------------------
          // 2) Detectar potência IMPLÍCITA: x2, y10, z3 etc.
          // ---------------------------------------------------
          if (/[a-zA-Z]/.test(c)) {
            let base = c; // a letra
            i++;

            // Ver se existe expoente (número) logo após a letra
            let expo = "";
            while (i < str.length && /[0-9]/.test(str[i])) {
              expo += str[i];
              i++;
            }

            result.push(base);

            // Se tem expoente, é potência
            if (expo.length > 0) {
              result.push("Dead");
              result.push(expo);
              result.push("Enter");
            }

            continue;
          }

          // ---------------------------------------------------
          // 3) Operadores
          // ---------------------------------------------------
          if ("+-/".includes(c)) {
            result.push(c);
            i++;
            continue;
          }

          // ---------------------------------------------------
          // 4) Ignorar multiplicações
          // ---------------------------------------------------
          if (c === "*") {
            i++;
            continue;
          }

          // ---------------------------------------------------
          // 5) Outros
          // ---------------------------------------------------
          result.push(c);
          i++;
        }

        return result;
      }

              res = bisseccao(inicio, final, resposta);
              tipoConta = "Bissecção";
            }

            //  console.log("teste", resposta);
          }
          //
          const testeEnvio = await envio("/envio/string", "POST", {
            formula: formulaBruta,
            resultado: res,
            conta: tipoConta,
          });
        });

        document.getElementById("btnGrafico").addEventListener("click", () => {
          // <div id="box"></div>
          let div = document.createElement("div");
          if (especificadores.some((c) => formulaBruta.includes(c))) {
            let nova = "";

            for (let a = 0; a < formulaBruta.length; a++) {
              if (!especificadores.includes(formulaBruta[a])) {
                nova += formulaBruta[a];
              }
            }

            formulaBruta = nova;
          }

          div.innerHTML = `
                <div id="spam">
                 <div id="divGraf">
                  <h3>Gráfico f(x) = ${formulaBruta}</h3>
                  <button id="btnFechar">x</button>
                 </div>
                 <div id="box"></div>
                </div>
                `;

          document.body.appendChild(div); // adiciona na página

          const spam = document.getElementById("spam");
          document.getElementById("btnFechar").addEventListener("click", () => {
            document.body.removeChild(document.body.lastElementChild);
          });

          const board = JXG.JSXGraph.initBoard("box", {
            boundingbox: [-10, 10, 10, -10],
            axis: true,
          });

          // função normal de JS
          const f = new Function("x", `return ${formulaBruta}`);
          board.create("functiongraph", [f, -100, 100]);
        });

        btnReuso.addEventListener("click", () => {
          
          // alert("aqui");
          formula.innerHTML = "";
          qtdElementos = 0;

          let nova = parseFormula(resultadoDaFormula.textContent);

          for (let a = 0; a < nova.length; a++) {
            adicionarElemento(nova[a]);
          }
        });

        let testamento = JSON.parse(localStorage.getItem("formula"));

        if (testamento != null) {
          for (let a = 0; a < testamento.length; a++) {
            adicionarElemento(testamento[a]);
          }
          localStorage.setItem("formula", "");
        }
      });
    </script>
  </body>
