      function transformarFormula(str) {
        // remover espaços
        str = str.replace(/\s+/g, "");

        // trocar "^" por "Dead" temporariamente
        str = str.replace(/\^/g, "Dead");

        let out = "";
        let i = 0;

        while (i < str.length) {
          // --- DETECTAR POTÊNCIA ---
          if (str.startsWith("Dead", i)) {
            i += 4; // pular "Dead"

            // coletar expoente inteiro
            let expo = "";
            while (i < str.length && /[0-9]/.test(str[i])) {
              expo += str[i];
              i++;
            }

            // aplicar formato da potência
            out += `;Dead;${expo};Enter;`;
            continue;
          }

          // --- DETECTAR xDeadN (forma base) ---
          // ex: xDead2
          if (/[a-zA-Z]/.test(str[i]) && str.startsWith("Dead", i + 1)) {
            out += str[i] + ";";
            i++;
            continue;
          }

          if (str[i] === "+") {
            out += ";+;";
            i++;
            continue;
          }

          if (str[i] === "-") {
            out += ";-;";
            i++;
            continue;
          }

          if (str[i] === "*") {
            i++;
            continue;
          }

          out += str[i];
          i++;
        }

        return out;
      }
function parseFormula(str) {
  str = str.replace(/\s+/g, ""); 
  const result = [];

  let i = 0;

  while (i < str.length) {
    const c = str[i];

    // 1) COEFICIENTE
    if (/[0-9]/.test(c)) {
      let numero = "";

      while (i < str.length && /[0-9]/.test(str[i])) {
        numero += str[i];
        i++;
      }

      result.push(numero);
      continue;
    }

    // 2) POTÊNCIA EXPLÍCITA x^2
    if (/[a-zA-Z]/.test(c) && str[i + 1] === "^") {
      let base = c;
      i += 2; 

      let expo = "";
      while (i < str.length && /[0-9]/.test(str[i])) {
        expo += str[i];
        i++;
      }

      result.push(base);
      result.push("Dead");
      result.push(expo);
        if (str[i] !== "/") {
    result.push("Enter");
  }
      continue;
    }

   // 3) POTÊNCIA IMPLÍCITA (x2, y10 etc.)
if (/[a-zA-Z]/.test(c)) {
  let base = c;
  i++;

  let expo = "";
  let start = i;

  // coleta números
  while (i < str.length && /[0-9]/.test(str[i])) {
    expo += str[i];
    i++;
  }

  result.push(base);


  if (str[i] === "/") {
    // NÃO ADICIONA ENTER
    // devolve expoente para ser lido como número normal
    i = start;
    continue;
  }

  // SE CHEGOU AQUI → potência válida
  if (expo.length > 0) {
    result.push("Dead");
    result.push(expo);
    result.push("Enter"); // ← agora só entra aqui se realmente terminou
  }

  continue;
}
    // 4) Operadores
    if ("+-/".includes(c)) {
      result.push(c);
      i++;
      continue;
    }

    // 5) Ignorar *
    if (c === "*") {
      i++;
      continue;
    }

    // 6) Outros
    result.push(c);
    i++;
  }

  return result;
}
